[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-assistant"
version = "0.1.0"
description = "Multi-modal RAG study assistant with agentic orchestration"
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "tavily-python>=0.3.0",
    "prefect>=2.19.0",
    "ragas>=0.1.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
